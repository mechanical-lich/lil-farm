<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5b8c4a">
<meta name="apple-mobile-web-app-title" content="Lil Farm">
<title>Lil Farm</title>
<!-- Relative paths throughout: GitHub Pages serves this from /lil-farm/. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui">
    <!-- Top bar: money and what the farmer is up to. -->
    <div id="hud">
      <button class="hud-chip" id="hud-money" aria-expanded="false">$0</button>
      <button class="hud-chip grow" id="hud-status" aria-expanded="false"
              title="What the farmer is doing — tap for the whole queue">
        <span id="hud-status-text">Idle</span>
        <span id="task-count">0</span>
      </button>
      <button class="hud-chip" id="inv-toggle">Bag 0</button>
    </div>

    <div id="debug"></div>

    <div id="toasts"></div>

    <!-- Bottom controls sit in thumb reach. -->
    <div id="bottom">
      <div id="confirm-bar">
        <div id="place-hint"></div>
        <div id="confirm-row">
          <button id="confirm-place">✓ Place here</button>
          <button id="cancel-place">✕ Cancel</button>
        </div>
      </div>
      <div id="sub-row"></div>
      <div id="toolbar"></div>
      <div id="controls">
        <button id="paint-toggle" title="Drag across the farm to queue lots of work">✋ Pan</button>
        <button id="shop-toggle">🏪 Shop</button>
        <button id="settings-toggle" title="Backup and settings" aria-label="Settings">⚙</button>
      </div>
    </div>

    <!-- Panels slide up from the bottom. -->
    <div class="panel" id="task-panel">
      <div class="panel-head">
        <h2>Task queue</h2>
        <button id="task-close">Done</button>
      </div>
      <ul id="task-list"></ul>
    </div>

    <div class="panel" id="shop-panel">
      <div class="panel-head">
        <h2>Shop</h2>
        <button id="shop-close">Done</button>
      </div>
      <div id="shop-tabs" class="tabs">
        <button data-tab="buy" class="on">Buy</button>
        <button data-tab="animals">Animals</button>
        <button data-tab="decor">Decor</button>
        <button data-tab="land">Land</button>
        <button data-tab="sell">Sell</button>
      </div>
      <div id="shop-note"></div>
      <ul id="shop-list"></ul>
    </div>

    <div class="panel" id="settings-panel">
      <div class="panel-head">
        <h2>Settings</h2>
        <button id="settings-close">Done</button>
      </div>
      <div id="settings-note"></div>
      <div class="settings-body">
        <h3>Back up your farm</h3>
        <p>Copy this somewhere safe. Browsers can clear saved data.</p>
        <textarea id="settings-export" readonly rows="2"></textarea>
        <button id="settings-copy">Copy farm</button>

        <h3>Restore a farm</h3>
        <p>Paste a backup here. This replaces the farm you have now.</p>
        <div id="settings-backups"></div>
        <textarea id="settings-import" rows="2" placeholder="Paste a saved farm…"></textarea>
        <button id="settings-import-go" class="danger"></button>

        <h3>Display</h3>
        <button id="settings-toollabels"></button>

        <h3>Debug</h3>
        <button id="settings-give">Top up supplies</button>
        <button id="settings-reset" class="danger"></button>
      </div>
    </div>

    <div class="panel" id="market-panel">
      <div class="panel-head">
        <h2>Market</h2>
        <div class="head-actions">
          <button id="market-sell">Sell…</button>
          <button id="market-close">Done</button>
        </div>
      </div>
      <p id="market-note"></p>
      <ul id="market-list"></ul>
    </div>

    <div class="panel" id="inv-panel">
      <div class="panel-head">
        <h2 id="inv-title">Bag</h2>
        <button id="inv-close">Done</button>
      </div>
      <div id="inv-tabs" class="tabs">
        <button data-tab="bag" class="on">Bag</button>
        <button data-tab="journal">Mushrooms</button>
        <button data-tab="flowers">Flowers</button>
      </div>
      <div id="inv-note"></div>
      <ul id="inv-list"></ul>
    </div>
  </div>

  <!-- "While you were away" card, shown once on return. -->
  <div id="summary">
    <div id="summary-card">
      <h2 id="summary-headline"></h2>
      <ul id="summary-lines"></ul>
      <button id="summary-close">Back to the farm</button>
    </div>
  </div>

  <div id="boot">
    <div id="boot-text">Loading the farm…</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
